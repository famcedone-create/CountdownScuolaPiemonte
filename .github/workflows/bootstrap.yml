name: Build APK Compatibility

on:
  workflow_dispatch:
  push:
    paths:
      - "CountdownScuolaPiemonte_AndroidWidget.zip"
      - ".github/workflows/bootstrap.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip -o CountdownScuolaPiemonte_AndroidWidget.zip

      - name: Configura APK compatibile
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.papa.countdownscuola"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.papa.countdownscuolapiemonte.compat"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 3
                  versionName = "1.1"
              }

              signingConfigs {
                  getByName("debug") {
                      enableV1Signing = true
                      enableV2Signing = true
                      enableV3Signing = true
                      enableV4Signing = false
                  }
              }

              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          if 'android:testOnly=' not in s:
              s = s.replace("<application", '<application android:testOnly="false"', 1)
          p.write_text(s)
          PY

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Android 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila APK
        run: gradle :app:assembleDebug

      - name: Verifica APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CountdownScuolaPiemonte-v3-compat.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: CountdownScuolaPiemonte-v3-compat
          path: CountdownScuolaPiemonte-v3-compat.apk
