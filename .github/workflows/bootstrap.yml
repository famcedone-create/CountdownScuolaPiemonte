name: Build Clean Release APK

on:
  workflow_dispatch:
  push:
    paths:
      - "CountdownScuolaPiemonte_AndroidWidget.zip"
      - ".github/workflows/bootstrap.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip -o CountdownScuolaPiemonte_AndroidWidget.zip

      - name: Configura release pulita
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.papa.countdownscuola"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.papa.countdownscuolapiemonte.v4"
                  minSdk = 26
                  targetSdk = 33
                  versionCode = 4
                  versionName = "1.2"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                  }
              }
          }
          EOF

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installa Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compila release NON firmata
        run: gradle :app:assembleRelease

      - name: Crea chiave nuova
        shell: bash
        run: |
          keytool -genkeypair \
            -keystore countdown-release.jks \
            -storepass android \
            -keypass android \
            -alias countdown \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Countdown Scuola,O=PAPA,C=IT"

      - name: Allinea APK
        shell: bash
        run: |
          UNSIGNED=$(find app/build/outputs/apk/release -name "*unsigned.apk" | head -1)
          echo "APK non firmato: $UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -p -f 4 \
            "$UNSIGNED" \
            app-aligned.apk

      - name: Firma APK da zero
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks countdown-release.jks \
            --ks-key-alias countdown \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out CountdownScuolaPiemonte-v4-clean.apk \
            app-aligned.apk

      - name: Verifica APK
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            --print-certs \
            CountdownScuolaPiemonte-v4-clean.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: CountdownScuolaPiemonte-v4-clean
          path: CountdownScuolaPiemonte-v4-clean.apk
