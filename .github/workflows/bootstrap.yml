name: Build Countdown XAU Clone

on:
  workflow_dispatch:
  push:
    paths:
      - "CountdownScuolaPiemonte_AndroidWidget-v6-XAU-CLONE.zip"
      - ".github/workflows/bootstrap.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Estrai progetto
        run: unzip -o CountdownScuolaPiemonte_AndroidWidget-v6-XAU-CLONE.zip

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compila APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CountdownScuola-v6-XAU-CLONE.apk

      - name: Salva APK
        uses: actions/upload-artifact@v4
        with:
          name: CountdownScuola-v6-XAU-CLONE
          path: CountdownScuola-v6-XAU-CLONE.apk
